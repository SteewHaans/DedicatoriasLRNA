<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Canciones para ti</title>

  <!-- ESTILOS -->
  <style id="estilos">
:root {
  --bg: #efe6d2;
  --paper: #fbf5e6;
  --ink: #1f3a2e;
  --soft: #7a7566;
  --rose: #d9738a;
  --note: #f7e8a8;
  --sh: rgba(70, 40, 40, .2);
  --g: #1f4d3a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px)
}
.vid { display: none }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height: 100%
}

* {
  box-sizing: border-box
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden
}

button {
  font: inherit;
  cursor: pointer
}

.scr {
  min-height: 100vh;
  display: none;
  position: relative
}

.scr.on {
  display: flex
}

#intro {
  align-items: center;
  justify-content: center;
  cursor: pointer
}

.env {
  width: min(150px, 38vw);
  aspect-ratio: 1.45;
  background: linear-gradient(135deg, #f1e0c2, #e2cba6);
  border-radius: 3px;
  position: relative;
  box-shadow: 0 8px 18px var(--sh);
  animation: fl 3s ease-in-out infinite;
  overflow: hidden
}



@keyframes fl {
  50% {
    transform: translateY(-6px)
  }
}

#bloom {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden
}

@keyframes pop {
  to {
    transform: scale(1)
  }
}

.fade {
  animation: fo .9s forwards
}

@keyframes fo {
  to {
    opacity: 0
  }
}

/* escena */
#tape {
  justify-content: center;
  background: linear-gradient(90deg, #ecc9c6, #f4ddd6 40%, #f2d8d0 60%, #e8c3c3)
}

.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none
}







.page {
  position: relative;
  z-index: 2;
  width: min(440px, 100%);
  background: var(--paper);
  box-shadow: 0 0 30px var(--sh);
  padding: 30px 26px 90px;
  background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, .015) 0 2px, transparent 2px 4px)
}

.eb {
  font: 600 10px/1 system-ui, sans-serif;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--soft)
}

h1 {
  font-size: 34px;
  font-weight: 500;
  margin: 10px 0 16px
}

.cas {
  width: 100%;
  display: block;
  margin: 0 auto 18px;
  filter: drop-shadow(0 10px 12px var(--sh))
}

.reel {
  transform-box: fill-box;
  transform-origin: center;
  animation: sp 5s linear infinite
}

.pl .reel {
  animation-duration: 1.4s
}

@keyframes sp {
  to {
    transform: rotate(360deg)
  }
}

.cols {
  display: grid;
  grid-template-columns: 1fr 175px;
  gap: 16px;
  align-items: start
}

.tr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-top: 1px solid rgba(120, 100, 80, .35)
}

.tr:last-of-type {
  border-bottom: 1px solid rgba(120, 100, 80, .35)
}

.tr em {
  width: 20px;
  color: var(--soft);
  font-size: 13px
}

.tr div {
  flex: 1;
  font-size: 13px
}

.tr b {
  display: block;
  font-size: 13px
}

.tr small {
  color: var(--soft);
  font-size: 11px
}

.pb {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--soft);
  background: none;
  color: var(--ink);
  font-size: 10px
}

.pb.a {
  background: var(--g);
  color: #fff;
  border-color: var(--g)
}

#now {
  font: 11px system-ui, sans-serif;
  color: var(--soft);
  margin-top: 8px;
  min-height: 14px
}

.note {
  background: var(--note);
  padding: 14px;
  box-shadow: 2px 3px 8px var(--sh);
  font-style: italic;
  font-size: 13.5px;
  line-height: 1.65
}

#nt {
  white-space: pre-line
}

.note .eb {
  font-style: normal;
  margin-bottom: 10px
}

.fin {
  margin-top: 16px;
  border: 0;
  background: var(--g);
  color: #fff;
  font: 600 9px system-ui, sans-serif;
  letter-spacing: .12em;
  padding: 9px 14px;
  border-radius: 99px
}

/* UI flotante */
.heart {
  position: fixed;
  left: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #7a2a45;
  color: #fff;
  border: 0;
  z-index: 40;
  display: grid;
  place-items: center
}

.pill {
  position: fixed;
  left: 56px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  background: #f6cdd5;
  color: #4a2a32;
  border: 0;
  border-radius: 99px;
  padding: 10px 20px;
  font: 11px system-ui, sans-serif;
  box-shadow: 0 3px 8px var(--sh);
  height: 34px
}

.help {
  position: fixed;
  right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  background: var(--g);
  color: #fff;
  border: 0;
  border-radius: 99px;
  padding: 8px 14px;
  font: 11px system-ui, sans-serif
}

#panel {
  position: fixed;
  left: 12px;
  bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  width: min(270px, calc(100vw - 24px));
  max-height: 70vh;
  overflow: auto;
  background: #2a1626;
  border-radius: 14px;
  padding: 8px;
  z-index: 45;
  display: none;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45)
}

#panel.on {
  display: flex
}

.let {
  background: var(--paper);
  border-radius: 10px;
  padding: 14px;
  text-align: center
}

.let h3 {
  margin: 6px 0;
  font-size: 17px
}

.let p {
  margin: 0;
  font-style: italic;
  font-size: 12px;
  color: var(--soft)
}

.let small {
  display: block;
  text-align: right;
  font-size: 9px;
  color: var(--soft);
  margin-top: 8px
}

.voz {
  background: var(--paper);
  border-radius: 99px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 6px;
  font: 11px system-ui, sans-serif
}

.voz button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0;
  background: var(--g);
  color: #fff;
  font-size: 10px
}

.voz .w {
  flex: 1;
  height: 14px;
  background: repeating-linear-gradient(90deg, #8a8575 0 2px, transparent 2px 5px);
  -webkit-mask: linear-gradient(90deg, #000 var(--p, 0%), rgba(0, 0, 0, .35) 0);
  mask: linear-gradient(90deg, #000 var(--p, 0%), rgba(0, 0, 0, .35) 0)
}

.bq {
  height: 150px;
  border-radius: 10px;
  background: radial-gradient(ellipse at 50% 120%, #7a2a55, #2a0f26 70%);
  text-align: center;
  color: #f3dbe6;
  padding-top: 10px;
  position: relative;
  overflow: hidden
}

.bq h4 {
  margin: 0;
  font-size: 14px;
  font-weight: 600
}

.bq small {
  font: 8px system-ui, sans-serif;
  letter-spacing: .14em;
  opacity: .7
}

.mini {
  background: #0e6477;
  border-radius: 8px;
  color: #fff;
  font: 11px system-ui, sans-serif;
  padding: 8px 10px;
  display: none;
  align-items: center;
  gap: 8px
}

.mini.on {
  display: flex
}

.mini div {
  flex: 1
}

.mini small {
  display: block;
  opacity: .8
}

.yt {
  display: none;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
  color: #fff;
  font: 10px system-ui, sans-serif
}

.yt.on {
  display: block
}

.yt iframe {
  width: 100%;
  aspect-ratio: 16/9;
  border: 0;
  display: block
}

.yt a {
  display: block;
  padding: 6px 10px;
  color: #9fd
}

#mo {
  position: fixed;
  inset: 0;
  background: rgba(30, 15, 25, .7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: 20px
}

#mo.on {
  display: flex
}

#mo div {
  background: var(--paper);
  max-width: 380px;
  padding: 26px;
  border-radius: 14px;
  text-align: center;
  line-height: 1.7
}

#mo button {
  margin-top: 12px;
  border: 0;
  background: var(--g);
  color: #fff;
  border-radius: 99px;
  padding: 9px 22px
}

@media(max-width:480px) {
  .cols {
    grid-template-columns: 1fr
  }
}

.scene {
  background: linear-gradient(rgba(244, 205, 205, .32), rgba(244, 205, 205, .32)), var(--fondo) center/cover no-repeat
}

.cp.cas {
  position: relative;
  aspect-ratio: 680/445;
  mix-blend-mode: multiply;
  container-type: inline-size;
  filter: none
}

.cp .ph {
  position: absolute;
  inset: 0;
  background: var(--ph) center/100% 100%
}

.hub {
  position: absolute;
  top: 32.58%;
  width: 15.29%;
  aspect-ratio: 1;
  border-radius: 50%;
  background-image: var(--ph);
  background-size: 653.8% auto;
  animation: sp 5s linear infinite
}

.pl .hub {
  animation-duration: 1.4s
}

.lab2 {
  position: absolute;
  left: 28.4%;
  top: 15.1%;
  width: 34.4%;
  height: 10.8%;
  background: #efece7;
  display: grid;
  place-items: center;
  font: italic 4cqw 'Bradley Hand', 'Segoe Script', 'Comic Sans MS', cursive;
  color: #2a2f45;
  white-space: nowrap
}

#bloom .f {
  position: absolute;
  transform: scale(0);
  animation: pop .9s cubic-bezier(.2, 1.3, .4, 1) forwards;
  background: var(--fl) center/contain no-repeat;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .3))
}

.env {
  width: min(320px, 74vw);
  aspect-ratio: 633/648;
  background: var(--env) center/contain no-repeat;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
  filter: drop-shadow(0 12px 14px rgba(70, 40, 40, .3))
}

#panel {
  max-height: min(72vh, 520px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #7a4a68 transparent;
  scroll-behavior: smooth
}

#panel>* {
  flex-shrink: 0
}

#panel::-webkit-scrollbar {
  width: 6px
}

#panel::-webkit-scrollbar-thumb {
  background: #7a4a68;
  border-radius: 6px
}

.bq {
  height: 200px
}

.vid {
  background: var(--paper);
  border-radius: 10px;
  padding: 10px;
  text-align: center
}

.vid h4 {
  margin: 2px 0 8px;
  font-size: 14px
}

.vid iframe,
.vid video {
  width: 100%;
  aspect-ratio: 16/9;
  border: 0;
  border-radius: 8px;
  background: #000;
  display: block
}

.vph {
  aspect-ratio: 16/9;
  border-radius: 8px;
  background: repeating-linear-gradient(45deg, #efe3d3 0 10px, #f6ecdd 10px 20px);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 4px;
  color: var(--soft);
  font: 11px system-ui, sans-serif
}

.vph span {
  font-size: 24px
}

.vl {
  display: block;
  margin-top: 6px;
  font: 11px system-ui, sans-serif;
  color: var(--rose)
}

.bq {
  height: 280px
}

.bq::after {
  content: '';
  position: absolute;
  inset: 44px 0 0;
  background: var(--ramo) 50% 100%/auto 100% no-repeat;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .45))
}

  <!-- FUNCIONAMIENTO -->
  <script>
const yid = x => (String(x).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [0, x])[1];

const $ = i => document.getElementById(i);
let cur = -1,
  vt;
$("who").textContent = "PARA " + DATA.para.toUpperCase() + " · DE " + DATA.de.toUpperCase();
$("ttl").textContent = DATA.titulo;
$("lab").textContent = DATA.titulo;
$("nt").textContent = DATA.nota;
$("cr").textContent = DATA.carta;
$("dd").textContent = "De " + DATA.de;
DATA.canciones.forEach((s, i) => {
  const d = document.createElement("div");
  d.className = "tr";
  d.innerHTML = '<em>' + String(i + 1).padStart(2, "0") + '</em><div><b></b><small></small></div><button class="pb" aria-label="Reproducir">▶</button>';
  d.querySelector("b").textContent = s.t;
  d.querySelector("small").textContent = s.a;
  d.querySelector("button").onclick = () => play(i);
  $("list").appendChild(d)
});
/* Reproductor de archivos que tienes descargados (mp3 / mp4) */
let media = null;
const esArchivo = x => /\.(mp3|m4a|wav|ogg|mp4|webm|mov)$/i.test(String(x).split("?")[0]);

function detener() {
  document.querySelectorAll("#list .pb").forEach(b => { b.classList.remove("a"); b.textContent = "▶" });
  cur = -1;
  $("cas").classList.remove("pl");
  $("now").textContent = "";
  $("yf").src = "";
  $("yf").style.display = "";
  $("yl").style.display = "";
  $("yt").classList.remove("on");
  $("mn").classList.remove("on");
  if (media) { media.pause(); media.remove(); media = null }
}

function play(i) {
  if (cur === i) return detener();
  detener();
  cur = i;
  const s = DATA.canciones[i];
  document.querySelectorAll("#list .pb").forEach((b, k) => {
    b.classList.toggle("a", k === i);
    b.textContent = k === i ? "❚❚" : "▶"
  });
  $("cas").classList.add("pl");
  $("now").textContent = "Sonando: " + s.t;
  $("mt").textContent = s.t;
  $("ma").textContent = s.a;
  $("mn").classList.add("on");
  const src = s.archivo || (esArchivo(s.id) ? s.id : "");
  if (src) {
    const esVideo = /\.(mp4|webm|mov)$/i.test(src);
    media = document.createElement(esVideo ? "video" : "audio");
    media.src = src;
    media.autoplay = true;
    media.controls = esVideo;
    media.playsInline = true;
    media.onended = detener;
    media.onerror = () => { $("now").textContent = "No encontré el archivo: " + src };
    if (esVideo) {
      media.style.cssText = "width:100%;display:block;border-radius:8px;background:#000";
      $("yf").style.display = "none";
      $("yl").style.display = "none";
      $("yt").appendChild(media);
      $("yt").classList.add("on")
    } else {
      document.body.appendChild(media)
    }
  } else {
    $("yf").src = "https://www.youtube-nocookie.com/embed/" + yid(s.id) + "?autoplay=1&playsinline=1";
    $("yl").href = "https://www.youtube.com/watch?v=" + yid(s.id);
    $("yt").classList.add("on")
  }
  $("panel").classList.add("on")
}
$("mp").onclick = () => {
  if (cur > -1) play(cur)
};
/* nota de voz (simulada) */
$("vb").onclick = () => {
  clearInterval(vt);
  if ($("vb").textContent === "❚❚") {
    $("vb").textContent = "▶";
    return
  }
  $("vb").textContent = "❚❚";
  let t = 0;
  vt = setInterval(() => {
    t += .25;
    $("vw").style.setProperty("--p", t / 15 * 100 + "%");
    $("vt").textContent = "0:" + String(Math.max(0, 15 - Math.floor(t))).padStart(2, "0");
    if (t >= 15) {
      clearInterval(vt);
      $("vb").textContent = "▶"
    }
  }, 250)
};
/* flores */
function fl() {
  const w = $("bloom");
  w.innerHTML = "";
  const cw = Math.max(110, Math.min(170, innerWidth / 6)),
    C = Math.ceil(innerWidth / cw) + 1,
    R = Math.ceil(innerHeight / cw) + 1;
  const add = (x, y, s, dl) => {
    const f = document.createElement("div");
    f.className = "f";
    f.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (x - s / 2) + "px;top:" + (y - s / 2) + "px;rotate:" + (Math.random() * 70 - 35) + "deg;animation-delay:" + dl + "s;filter:hue-rotate(" + (Math.random() * 16 - 8) + "deg) saturate(" + (.9 + Math.random() * .5) + ") brightness(" + (.95 + Math.random() * .25) + ")" + (Math.random() < .5 ? ";scale:-1 1" : "");
    w.appendChild(f)
  };
  for (let r = 0; r < R; r++)
    for (let c = 0; c < C; c++) add(c * cw + Math.random() * cw * .5, r * cw + Math.random() * cw * .5, cw * (1.5 + Math.random() * .7), Math.random() * 1.4);
  for (let k = 0; k < C * R * .5; k++) add(Math.random() * innerWidth, Math.random() * innerHeight, cw * (.9 + Math.random() * .6), Math.random() * 1.6)
}
$("intro").onclick = () => {
  fl();
  setTimeout(() => {
    $("intro").classList.remove("on");
    $("tape").classList.add("on");
    $("pl").style.display = "block"
  }, 2400);
  setTimeout(() => $("bloom").classList.add("fade"), 2600);
  setTimeout(() => {
    $("bloom").innerHTML = "";
    $("bloom").classList.remove("fade")
  }, 3600)
};
(function() {
  const v = DATA.video,
    b = $("vbox");
  if (!v) {
    b.innerHTML = '<div class="vph"><span>▶</span>Tu video aparecerá aquí</div>';
    return
  }
  const m = v.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if (m) {
    b.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '?playsinline=1" allow="encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video"></iframe><a class="vl" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + m[1] + '">Abrir en YouTube</a>'
  } else {
    const e = document.createElement("video");
    e.src = v;
    e.controls = true;
    e.playsInline = true;
    e.preload = "metadata";
    b.appendChild(e)
  }
})();
const tg = () => $("panel").classList.toggle("on");
$("hb").onclick = tg;
$("pl").onclick = tg;
const mo = t => {
  $("mp2").textContent = t;
  $("mo").classList.add("on")
};
$("hp").onclick = () => mo("Toca ▶ en una canción para escuchar. Abre el panel con el corazón para ver la carta, la nota de voz y tu ramo.");
$("fn").onclick = () => mo(DATA.final);
$("mc").onclick = () => $("mo").classList.remove("on");
  </script>
